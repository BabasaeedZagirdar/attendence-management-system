spring.application.name=attendance
server.port=8080

# ---- MySQL (database is auto-created) ----
spring.datasource.url=jdbc:mysql://localhost:3306/attendance_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=admin123

# ---- JPA / Hibernate (tables are auto-created/updated) ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ---- JWT (change the secret in production; must be Base64, 256 bits or more) ----
app.jwt.secret=${JWT_SECRET:sY5eXPVKZyPuSStp8Pd+TGrTrpNjvFOsIxuPEkbCYTBgFRQVbjSIu3PNvh+7giGt}
app.jwt.expiration-ms=86400000

# ---- Google OAuth2 (Web client ID from Google Cloud Console) ----
app.google.client-id=${GOOGLE_CLIENT_ID:}

# ---- Web ----
app.cors.allowed-origin=http://localhost:5173
app.frontend-url=http://localhost:5173

# ---- Default admin created on first start ----
app.admin.name=System Admin
app.admin.email=${ADMIN_EMAIL:admin@college.com}
app.admin.password=${ADMIN_PASSWORD:Admin@123}
